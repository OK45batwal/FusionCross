name: Bug Report
description: Create a report to help us improve FusionCross
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with FusionCross! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: input
    id: mac_model
    attributes:
      label: Mac Model & Chip
      description: e.g. MacBook Pro 14" M3 Pro, MacBook Air M1, Mac Studio M2 Max
      placeholder: MacBook Pro M3 Max 36GB
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      description: e.g. macOS 14.6 Sonoma, macOS 15.0 Sequoia
      placeholder: macOS 15.0
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: FusionCross Version
      description: e.g. v2.0.0
      placeholder: v2.0.0
    validations:
      required: true
  - type: input
    id: wine_runtime
    attributes:
      label: Wine Runtime Used
      description: e.g. Whisky-Wine 11.0 (Apple GPTK), Wine Stable 9.0, CrossOver Wine
      placeholder: Whisky-Wine (Apple GPTK)
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open FusionCross
        2. Create a bottle named "Gaming"
        3. Drop executable "app.exe"
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics / Logs Output
      description: Paste any logs from FusionCross Diagnostics (⌘K -> Diagnostics) or terminal output.
      render: shell
    validations:
      required: false
